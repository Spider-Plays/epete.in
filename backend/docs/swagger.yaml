openapi: 3.0.0
info:
  title: Clothing E-Commerce API
  description: API for a clothing e-commerce platform
  version: 1.0.0
  contact:
    name: API Support
    url: https://www.example.com/example.com/support
    email: support@example.com
servers:
  - url: http://localhost:5000/api
    description: Development server
  - url: https://api.example.com
    description: Production server
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: password123
                name:
                  type: string
                  example: John Doe
                phone:
                  type: string
                  pattern: "^\\+?[1-9]\\d{1,14}$"
                  example: "+1234567890"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          name:
                            type: string
                          role:
                            type: string
                            enum: [customer, admin]
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '400':
          description: Validation error
        '409':
          description: User already exists
  /auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          name:
                            type: string
                          role:
                            type: string
                            enum: [customer, admin]
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '400':
          description: Validation error
        '401':
          description: Invalid credentials
  /auth/profile:
    get:
      summary: Get user profile
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          description: Bearer access token
          required: true
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      role:
                        type: string
                        enum: [customer, admin]
                      emailVerified:
                        type: boolean
        '401':
          description: Missing or invalid token
        '404':
          description: User not found
  /auth/refresh-token:
    post:
      summary: Refresh access token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
        '400':
          description: Missing refresh token
        '401':
          description: Invalid refresh token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Auth
    description: 
    description: Authentication endpoints
