services:
  - type: web
    name: epete-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate --schema src/prisma/schema.prisma && npm run build
    startCommand: npx prisma migrate deploy --schema src/prisma/schema.prisma && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
