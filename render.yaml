services:
  - type: web
    name: epete-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npx prisma generate --schema src/prisma/schema.prisma && npm run build
    startCommand: npx prisma db push --schema src/prisma/schema.prisma && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: FRONTEND_URL
        sync: false
